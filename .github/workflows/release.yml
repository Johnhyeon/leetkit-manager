name: Release

# 태그 푸시(v*) 시 자동:
# 1. Python 빌드 (wheel + sdist) — Ubuntu
# 2. 독립 실행 Windows exe 빌드(LeetKitManager.exe) — Windows 러너(PyInstaller는
#    빌드하는 OS의 실행 파일만 만들 수 있어서 이 작업만 별도 러너가 필요하다)
# 3. PyPI 업로드 + GitHub Release 생성(wheel/tar.gz/exe 전부 첨부)

on:
  push:
    tags:
      - 'v*'  # v0.1.0, v0.2.0 등

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify version matches tag
        run: |
          # 버전은 leetkit_manager/__init__.py 한 곳에만 있다(pyproject는 여기서 읽어간다).
          # 예전엔 pyproject의 project.version을 봤는데, 두 곳에 적혀 있던 시절의 흔적이라
          # 동적 버전으로 바꾸자마자 KeyError로 릴리스가 통째로 멈췄다.
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import leetkit_manager as m; print(m.__version__)")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag version ($TAG_VER) does not match __version__ ($PKG_VER)"
            exit 1
          fi
          echo "Version OK: $PKG_VER"

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify distribution
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      # 배포하기 전에, 깨끗한 환경에 방금 만든 패키지를 설치해 실제로 동작하는지 본다.
      #
      # 개발 PC에는 다른 패키지가 끌어온 의존성이 남아 있어 "여기선 되는데"를 못 잡는다.
      # 실제로 packaging을 의존성에 안 적었는데 윈도우에서는 우연히 딸려와 티가 안 났고,
      # 맥에서만 폴백 경로를 타서 최신 사용자에게 옛 버전으로 내려가라고 권했다.
      # 단순 import 검사로는 못 잡는다(지연 import라서) — 실제로 불러서 확인한다.
      - name: 깨끗한 환경에서 동작 확인
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet --upgrade pip
          # --no-cache-dir: 의존성을 새로 풀어 "오늘 처음 설치하는 사람"과 같은 조건을 만든다.
          /tmp/verify/bin/pip install --quiet --no-cache-dir dist/*.whl
          echo "── 실제로 깔린 의존성 ──"
          /tmp/verify/bin/pip list
          # 소스 트리가 아니라 설치된 패키지를 보게 홈에서 실행한다.
          cd /tmp && /tmp/verify/bin/python - <<'PY'
          import leetkit_manager
          from leetkit_manager import orchestrator, package_service, review_prompt, shortcut  # noqa: F401
          from leetkit_manager.package_service import version_gt

          print("버전:", leetkit_manager.__version__)

          # 지연 import하는 의존성은 "안 적어도 당장은 돌아가는" 탓에 빠지기 쉽다 —
          # 실제로 packaging이 그렇게 빠졌고, 윈도우에서는 다른 패키지가 우연히 끌어와
          # 티가 안 났다. 선언돼서 실제로 깔렸는지 여기서 못 박는다.
          import packaging.version  # noqa: F401

          assert version_gt("0.1.10", "0.1.9"), "새 버전을 새 버전으로 못 알아본다"
          assert not version_gt("0.1.9", "0.1.10"), "옛 버전으로 내려가라고 권한다"
          assert not version_gt("0.1.9", "0.1.9"), "같은 버전을 업데이트라고 한다"
          print("동작 확인 OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 전용 venv에서 빌드한다. 러너 이미지에 미리 깔린 패키지가 sys.path로 섞이면
      # PyInstaller가 그걸 같이 담는다 — v0.1.13 exe가 정확히 그렇게 깨졌다. pip는
      # cffi 2.1.1을 새로 설치했는데 번들에는 러너에 있던 _cffi_backend 2.0.0이 들어가,
      # 켜자마자 "Version mismatch"로 죽었다. venv는 우리가 넣은 것만 보므로 그럴 수 없다.
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv-build
          .\.venv-build\Scripts\python -m pip install --upgrade pip
          .\.venv-build\Scripts\python -m pip install -e ".[build]"

      # 구매자에게 "exe 하나만 받으면 끝"을 실제로 제공하는 핵심 산출물 — 지금까지는
      # 이 작업 자체가 워크플로에 없어서 GitHub Release에 exe가 절대 안 올라갔다.
      - name: Build standalone exe
        shell: pwsh
        run: |
          .\.venv-build\Scripts\Activate.ps1
          .\packaging\build_exe.ps1

      # 빌드 성공과 "실제로 켜진다"는 다른 얘기다. v0.1.13은 빌드도 --help도 멀쩡했는데
      # 창을 띄우는 순간 죽었다 — 아무 검사에도 안 걸려 그대로 배포됐다. 창 직전까지
      # 필요한 것들을 실제로 불러와 보고, 안 되면 여기서 배포를 멈춘다.
      - name: 빌드된 exe가 실제로 뜨는지 확인
        shell: pwsh
        run: |
          $out = & .\dist_exe\LeetKitManager.exe selftest 2>&1
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) {
            Write-Host "::error::빌드된 exe가 시작되지 못했습니다 — 배포를 중단합니다"
            exit 1
          }

      # 자체 업데이트는 실행 중인 exe를 통째로 교체한다 — 받은 파일이 여기서 빌드된
      # 그 파일이 맞는지 앱이 대조할 수 있게 체크섬을 같이 올린다(package_service의
      # fetch_expected_sha256/sha256_of_file이 이 파일을 읽는다).
      - name: Write exe checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist_exe\LeetKitManager.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  LeetKitManager.exe" | Out-File -FilePath dist_exe\LeetKitManager.exe.sha256 -Encoding ascii -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist_exe/LeetKitManager.exe
            dist_exe/LeetKitManager.exe.sha256

  release:
    needs: [build-wheel, build-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub Release 생성용
      id-token: write  # PyPI Trusted Publishing (OIDC) 용
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheel-dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist_exe

      # Trusted Publishing (OIDC) — PyPI에 등록된 publisher가 자동 인증
      # https://docs.pypi.org/trusted-publishers/
      # 설정: PyPI > Account > Publishing > Add pending publisher
      #   Project: leetkit-manager / Owner: Johnhyeon / Repo: leetkit-manager
      #   Workflow: release.yml / Environment: (비워둠)
      # PyPI 업로드가 실패해도(예: pending publisher 미등록, 이미 올라간 버전) 아래
      # GitHub Release는 반드시 만들어져야 한다 — 구매자가 실제로 받는 건 거기 붙는
      # exe이고, PyPI는 명령줄 사용자용 부가 경로다. 실패는 워크플로에 경고로 남는다.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist_exe/LeetKitManager.exe
            dist_exe/LeetKitManager.exe.sha256
          generate_release_notes: true
          body: |
            > StockLens/DartLens/TelegramLens 설치·진단·업데이트를 한 창에서. 별도 라이선스 키 없이 무료로 씁니다.

            ---

            ## 📥 설치

            **Windows · 명령줄이 익숙하지 않다면** — 아래 `LeetKitManager.exe`를 받아 더블클릭하면 바로 실행됩니다. Lens 설치·업데이트에 필요한 `uv`가 없으면 자동으로 설치합니다.

            **macOS** — 현재 전용 앱이 없어 명령줄로 설치합니다.
            ```
            uv tool install leetkit-manager
            leetkit-manager gui
            ```

            **Windows에서도 명령줄이 편하다면**
            ```
            uv tool install leetkit-manager
            ```

            > **처음 실행할 때 경고가 뜰 수 있습니다.** 서명 안 된 프로그램이라 그렇습니다.
            > - SmartScreen: "추가 정보" → "실행"
            > - 백신이 차단하는 경우: 오탐입니다. 예외 등록 방법은 [백신 안내](https://github.com/Johnhyeon/leetkit-manager/blob/main/packaging/ANTIVIRUS_GUIDE.md) 참고
            > - 파일이 맞는지 확인하려면 위 `LeetKitManager.exe.sha256`의 값과 대조하세요

            ## 📚 링크
            - [stocklens-mcp](https://github.com/Johnhyeon/stocklens-mcp)
            - [dartlens-mcp](https://github.com/Johnhyeon/dartlens-mcp)
            - [telegramlens-mcp](https://github.com/Johnhyeon/telegramlens-mcp)
