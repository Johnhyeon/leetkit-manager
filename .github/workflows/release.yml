name: Release

# 태그 푸시(v*) 시 자동:
# 1. Python 빌드 (wheel + sdist)
# 2. PyPI 업로드
# 3. GitHub Release 생성 + dist 자산 첨부

on:
  push:
    tags:
      - 'v*'  # v0.1.0, v0.2.0 등

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub Release 생성용
      id-token: write  # PyPI Trusted Publishing (OIDC) 용
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify version matches tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Tag version ($TAG_VER) does not match pyproject.toml version ($PKG_VER)"
            exit 1
          fi
          echo "Version OK: $PKG_VER"

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify distribution
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      # Trusted Publishing (OIDC) — PyPI에 등록된 publisher가 자동 인증
      # https://docs.pypi.org/trusted-publishers/
      # 설정: PyPI > Account > Publishing > Add pending publisher
      #   Project: leetkit-manager / Owner: Johnhyeon / Repo: leetkit-manager
      #   Workflow: release.yml / Environment: (비워둠)
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            > StockLens/DartLens/TelegramLens 설치·진단·업데이트를 한 창에서. 별도 라이선스 키 없이 무료로 씁니다.

            ---

            ## 📥 설치 / 업그레이드 (한 줄)

            ```
            uv tool install leetkit-manager
            ```

            ## 📚 링크
            - [stocklens-mcp](https://github.com/Johnhyeon/stocklens-mcp)
            - [dartlens-mcp](https://github.com/Johnhyeon/dartlens-mcp)
            - [telegramlens-mcp](https://github.com/Johnhyeon/telegramlens-mcp)
