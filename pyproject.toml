[project]
name = "leetkit-manager"
# 버전은 leetkit_manager/__init__.py 한 곳에만 적는다. 예전엔 여기와 __init__.py에
# 따로 적혀 있었는데 __init__.py 쪽을 안 올려서 0.1.0에 멈췄고, 앱이 자기 버전을
# 0.1.0으로 읽는 바람에 (1) 화면에 옛 버전이 뜨고 (2) 최신을 깔아도 항상 "업데이트
# 있음"으로 판정돼 업데이트 버튼이 영영 사라지지 않았다.
dynamic = ["version"]
description = "StockLens/DartLens/TelegramLens 통합 설치·진단·업데이트 Manager"
readme = "README.md"
license = { text = "Proprietary" }
authors = [
    { name = "Johnhyeon" }
]
keywords = ["mcp", "claude", "stocklens", "dartlens", "telegramlens", "manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: Korean",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pywebview>=5.0",
    "psutil>=5.9",
    # 버전 비교(version_gt)에 쓴다. 선언이 빠져 있었는데 윈도우에서는 다른 패키지가
    # 우연히 끌어와 티가 안 났고, 맥 uv 환경에는 없어서 폴백 경로를 탔다 — 그 폴백이
    # "다르면 새 버전"이라 최신 사용자에게 옛 버전으로 내려가라고 권했다.
    "packaging>=23.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
# PyPI 배포에는 필요 없음 — packaging/build_exe.ps1로 독립 exe를 만들 때만.
build = ["pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/Johnhyeon/leetkit-manager"
Repository = "https://github.com/Johnhyeon/leetkit-manager"
Issues = "https://github.com/Johnhyeon/leetkit-manager/issues"

[project.scripts]
leetkit-manager = "leetkit_manager.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "leetkit_manager/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["leetkit_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 실제 전역 uv tool 설치를 호출하는 통합 테스트 (기본 스위트에서 제외 권장: -m 'not integration')",
]
